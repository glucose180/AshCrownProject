<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#181818">
  <title>겨울성으로 가는 길</title>
  <meta name="description" content="동행인을 만나고 북부의 길을 건너 아미르 칸에게 보낼 서신을 전달하는 짧은 이야기 게임">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23a9c5bc' d='M4 28V8h5v5h5V4h5v9h5V8h4v20H4Z'/%3E/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header><p class="eyebrow">북부의 칸</p><h1>겨울성으로 가는 길</h1></header>
  <p class="rotate-hint">기기를 가로로 돌리면 맵을 더 넓게 볼 수 있어요.</p>
  <section class="map-section" aria-label="이동 지도">
    <div class="map-toolbar">
      <p class="intro" id="map-help">밝은 발판이나 장소명을 선택하여 이동할 수 있습니다.</p>
      <button id="reset" class="reset" type="button"><span class="reset-arrow" aria-hidden="true">↺</span><span>처음으로</span></button>
    </div>
    <div class="map" id="map" aria-label="서릿돌 성 주변 입체 이동 지도" aria-describedby="map-help">
      <div id="scene"></div><div id="character-layer" class="sr-only" aria-label="지도 위 인물"></div><div id="markers"></div>
      <p class="north">북부 · 설원</p><p class="south">모라크 · 콰스 방면</p>
      <p class="loading" id="loading">지도를 펼치는 중…</p>
      <section id="ending-overlay" class="ending-overlay" aria-labelledby="ending-title" hidden>
        <div class="ending-message" aria-live="polite" aria-atomic="true">
          <h2 id="ending-title"></h2>
          <p id="ending-anniversary" class="ending-anniversary"></p>
          <p id="ending-dedication" class="ending-dedication"></p>
        </div>
      </section>
    </div>
  </section>
  <section class="panel" aria-labelledby="place">
    <div><h2 id="place" tabindex="-1">출발점</h2></div>
    <p id="journey-status" class="journey-status" aria-live="polite"></p>
    <p id="party" class="party" aria-label="동행인"></p>
    <div class="scene-content">
      <p id="desc" aria-live="polite" aria-atomic="true"></p>
      <form id="name-form" class="name-form">
        <label for="player-name">이름 <span>(비워 두면 ‘당신’)</span></label>
        <input id="player-name" name="player-name" type="text" maxlength="20" autocomplete="off" placeholder="당신" aria-describedby="name-hint">
        <small id="name-hint">20자까지 입력할 수 있습니다.</small>
      </form>
      <div id="actions" class="actions" role="group" aria-label="행동 선택"></div>
    </div>
  </section>
</main>
<script type="module" src="map.js"></script>
</body>
</html>
